name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-demo
  CONTAINER_NAME: flask-app
  HOST_PORT: 5000

jobs:
  # 1. Run unit tests on a GitHub-hosted runner
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # 2. Build the image and push it to Docker Hub (only on push to main)
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short commit SHA
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Pull the new image and restart the container on the laptop
  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-demo:${{ needs.build-and-push.outputs.tag }}
    steps:
      - name: Pull image from Docker Hub
        shell: powershell
        run: |
          docker pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Replace running container
        shell: powershell
        run: |
          $existing = docker ps -aq --filter "name=^$env:CONTAINER_NAME$"
          if ($existing) { docker rm -f $env:CONTAINER_NAME | Out-Null }
          docker run -d --name $env:CONTAINER_NAME --restart unless-stopped `
            -p "$($env:HOST_PORT):5000" $env:IMAGE
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Health check
        shell: powershell
        run: |
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-RestMethod "http://localhost:$env:HOST_PORT/health"
              Write-Host "Healthy - running version $($r.version)"
              exit 0
            } catch {
              Write-Host "Attempt $i failed, retrying in 3s..."
              Start-Sleep -Seconds 3
            }
          }
          docker logs $env:CONTAINER_NAME
          exit 1

      - name: Remove old images
        if: always()
        shell: powershell
        run: docker image prune -f | Out-Null
