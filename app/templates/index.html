<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask CI/CD Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #1e293b; border-radius: 12px; padding: 32px; max-width: 560px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    h1 { margin-top: 0; color: #38bdf8; font-size: 1.6rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    td { padding: 8px 0; border-bottom: 1px solid #334155; }
    td:first-child { color: #94a3b8; width: 40%; }
    code { color: #fbbf24; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ message }}</h1>
    <p>Pipeline: GitHub &rarr; Actions &rarr; Docker Hub &rarr; self-hosted runner</p>
    <table>
      <tr><td>Commit</td><td><code>{{ commit }}</code></td></tr>
      <tr><td>Container ID</td><td><code>{{ container }}</code></td></tr>
      <tr><td>Started</td><td>{{ started_at }}</td></tr>
    </table>
  </div>
</body>
</html>
